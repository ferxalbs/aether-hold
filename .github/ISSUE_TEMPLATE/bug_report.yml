name: Bug report
description: Report a reproducible product or policy defect.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private communications, or personal data.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Describe the context, safe synthetic draft shape, and steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

